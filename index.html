<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SecureBank - Online Banking Login Portal">
    <title>Engineering Bank - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Bank Logo and Header -->
            <div class="login-header">
                <div class="bank-logo">🏦</div>
                <h1>Engineering Bank</h1>
                <p>Welcome back! Please login to your account.</p>
            </div>

            <!-- Notification Area -->
            <div id="notification" class="notification">
                <span id="notification-icon"></span>
                <span id="notification-message"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="return handleLogin(event)">
                <!-- Username/Email Field -->
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-control" 
                        placeholder="Enter your username or email"
                        autocomplete="username"
                    >
                    <span id="username-error" class="error-message">Please enter a valid username or email</span>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                    <span id="password-error" class="error-message">Password is required</span>
                </div>

                <!-- Login Button -->
                <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
                    Login
                </button>
            </form>

            <!-- Demo Login Section (For Testing) -->
            <div class="testing-controls">
                <h4>🧪 Demo Accounts (For Testing)</h4>
                <p class="text-muted" style="font-size: 0.875rem; margin-bottom: 1rem;">
                    Click to login as a demo user with different account states:
                </p>
                <div class="state-buttons">
                    <button class="state-btn" onclick="demoLogin('verified')">
                        ✅ Verified Account
                    </button>
                    <button class="state-btn" onclick="demoLogin('unverified')">
                        ⏳ Unverified Account
                    </button>
                    <button class="state-btn" onclick="demoLogin('suspended')">
                        ⚠️ Suspended Account
                    </button>
                    <button class="state-btn" onclick="demoLogin('closed')">
                        ❌ Closed Account
                    </button>
                </div>
            </div>

            <!-- Admin Link -->
            <div class="text-center mt-2">
                <a href="admin.html" style="color: var(--text-muted); font-size: 0.875rem;">
                    Admin Portal →
                </a>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // Login Page JavaScript
        // ========================================

        /**
         * Handle login form submission
         * @param {Event} event - Form submit event
         * @returns {boolean} - False to prevent form submission
         */
        function handleLogin(event) {
            event.preventDefault();
            
            // Get form values
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            // Reset error states
            clearErrors();
            
            // Validate inputs
            let isValid = true;
            
            // Username validation
            if (!username) {
                showError('username', 'Please enter your username or email');
                isValid = false;
            } else if (username.length < 3) {
                showError('username', 'Username must be at least 3 characters');
                isValid = false;
            }
            
            // Password validation
            if (!password) {
                showError('password', 'Password is required');
                isValid = false;
            } else if (password.length < 4) {
                showError('password', 'Password must be at least 4 characters');
                isValid = false;
            }
            
            if (!isValid) {
                showNotification('Please fix the errors above', 'error');
                return false;
            }
            
            // Simulate login check (demo credentials)
            const demoUsers = {
                'mohammed.osama': { password: 'password123', status: 'verified' },
                'youssef.mabrouk': { password: 'pass456', status: 'unverified' },
                'ahmed.hesam': { password: 'ahmedpass', status: 'suspended' },
                'abdelrahman': { password: 'abdel123', status: 'closed' }
            };
            
            const user = demoUsers[username.toLowerCase()];
            
            if (user && user.password === password) {
                // Successful login
                showNotification('Login successful! Redirecting...', 'success');
                
                // Store user data
                sessionStorage.setItem('loggedIn', 'true');
                sessionStorage.setItem('username', username);
                sessionStorage.setItem('accountStatus', user.status);
                
                // Redirect to dashboard after delay
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                // Failed login
                showNotification('Invalid username or password', 'error');
            }
            
            return false;
        }

        /**
         * Demo login with predefined account state
         * @param {string} status - Account status to demo
         */
        function demoLogin(status) {
            const demoData = {
                verified: { name: 'Mohammed Osama', accountNumber: '1234567890' },
                unverified: { name: 'Youssef Mabrouk', accountNumber: '0987654321' },
                suspended: { name: 'Ahmed Hesam', accountNumber: '5555555555' },
                closed: { name: 'Abdelrahman', accountNumber: '1111111111' }
            };
            
            const data = demoData[status];
            
            // Store demo user data
            sessionStorage.setItem('loggedIn', 'true');
            sessionStorage.setItem('username', data.name);
            sessionStorage.setItem('accountNumber', data.accountNumber);
            sessionStorage.setItem('accountStatus', status);
            sessionStorage.setItem('balance', '1000.00');
            
            showNotification(`Logging in as ${data.name} (${status})...`, 'success');
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 800);
        }

        /**
         * Show error for a specific field
         * @param {string} fieldId - Field ID
         * @param {string} message - Error message
         */
        function showError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const error = document.getElementById(fieldId + '-error');
            
            field.classList.add('error');
            error.textContent = message;
            error.classList.add('visible');
        }

        /**
         * Clear all error states
         */
        function clearErrors() {
            document.querySelectorAll('.form-control').forEach(field => {
                field.classList.remove('error');
            });
            document.querySelectorAll('.error-message').forEach(error => {
                error.classList.remove('visible');
            });
        }

        /**
         * Show notification message
         * @param {string} message - Message to display
         * @param {string} type - Notification type (success, error, warning, info)
         */
        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            const icon = document.getElementById('notification-icon');
            const text = document.getElementById('notification-message');
            
            // Set icon based on type
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };
            
            // Remove all type classes
            notification.className = 'notification visible notification-' + type;
            icon.textContent = icons[type] || icons.info;
            text.textContent = message;
            
            // Auto-hide after 5 seconds (except for errors)
            if (type !== 'error') {
                setTimeout(() => {
                    notification.classList.remove('visible');
                }, 5000);
            }
        }

        // Real-time validation on input
        document.getElementById('username').addEventListener('input', function() {
            if (this.value.trim().length >= 3) {
                this.classList.remove('error');
                document.getElementById('username-error').classList.remove('visible');
            }
        });

        document.getElementById('password').addEventListener('input', function() {
            if (this.value.length >= 4) {
                this.classList.remove('error');
                document.getElementById('password-error').classList.remove('visible');
            }
        });
    </script>
</body>
</html>
